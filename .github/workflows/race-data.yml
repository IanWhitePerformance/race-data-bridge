# Fetches the open 3D data (terrain, OpenStreetMap, aerial imagery) for each race course in courses/
# and commits it to this branch. Runs on demand (Actions tab > race-data > Run workflow) or when a course file changes.
name: race-data
on:
  workflow_dispatch:
    inputs:
      race:
        description: race id (taupo, roth, hawaii703) or all
        default: all
      only:
        description: optional comma list of sources to re-run (osm, osm_detail, ndsm, nz, bayern, bayern_probe, lod2, us_lidar, terrain, profile); empty runs everything
        default: ''
      lidar_max_cells:
        description: optional cap on US LiDAR cells, for a quick test run
        default: ''
  push:
    branches: [main]
    paths: ['courses/**', 'fetch_race_data.py', '.github/workflows/race-data.yml']
permissions:
  contents: write
concurrency: race-data-${{ github.event.inputs.race || github.sha }}   # one run per race at a time; different races run side by side
jobs:
  # which courses to fetch: the one named on a manual run, all of courses/ for 'all', or on a push the course files that changed
  plan:
    runs-on: ubuntu-24.04
    outputs:
      ids: ${{ steps.p.outputs.ids }}
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 2}
      - id: p
        run: |
          sel="${{ github.event.inputs.race || '' }}"
          if [ -n "$sel" ] && [ "$sel" != "all" ]; then ids="$sel"
          elif [ "$sel" = "all" ]; then ids=$(ls courses/*.json | xargs -n1 basename | sed 's/.json//')
          else ids=$(git diff --name-only HEAD~1 HEAD -- courses/ | grep '\.json$' | xargs -rn1 basename | sed 's/.json//')
               if git diff --name-only HEAD~1 HEAD | grep -q 'fetch_race_data.py\|workflows'; then ids=""; fi; fi
          echo "ids=$(echo $ids | tr ' ' '\n' | jq -R . | jq -sc 'map(select(length>0))')" >> $GITHUB_OUTPUT
  fetch:
    needs: plan
    if: needs.plan.outputs.ids != '[]'
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        id: ${{ fromJson(needs.plan.outputs.ids) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq osmium-tool
      - name: PDAL (conda-forge, for the US LiDAR point clouds)
        run: |
          curl -Ls https://micro.mamba.pm/api/micromamba/linux-64/latest | tar -xj bin/micromamba
          ./bin/micromamba create -y -q -p $HOME/pdalenv -c conda-forge pdal
          echo "PDAL_BIN=$HOME/pdalenv/bin/pdal" >> $GITHUB_ENV
      - run: pip install requests numpy pillow rasterio pyproj scipy shapely
      - name: fetch ${{ matrix.id }}
        run: |
          f=courses/${{ matrix.id }}.json; [ -f $f ] || f=courses-done/${{ matrix.id }}.json
          ONLY="${{ github.event.inputs.only || '' }}" LIDAR_MAX_CELLS="${{ github.event.inputs.lidar_max_cells || '' }}" timeout 300m python3 fetch_race_data.py $f || echo "fetch for ${{ matrix.id }} stopped early"
      - name: commit ${{ matrix.id }}
        run: |
          git config user.name "race-data bot"; git config user.email "actions@users.noreply.github.com"
          git add data/${{ matrix.id }} && git commit -q -m "race data: $(date -u +%F) for ${{ matrix.id }}" || exit 0
          for i in 1 2 3 4 5 6; do git pull --rebase -X theirs -q && git push -q && exit 0 || { git rebase --abort 2>/dev/null; sleep $((10*i)); }; done
          echo "::error::could not push the ${{ matrix.id }} data"; exit 1
